[project]
name = "merchant-risk-agent"
version = "0.1.0"
description = "A learning project: an AI agent that investigates merchants for onboarding risk, built with Google ADK."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "google-adk>=2.0.0,<3.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "python-whois>=0.9.4",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
